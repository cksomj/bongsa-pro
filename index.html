<script>
(function(){
  var core='index-core.html?core=20260808-jw-restore';
  fetch(core,{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(html){
    var bridge='<script src="jw_search_restore.js?v=20260808-jw-restore"></'+'script>';
    if(html.indexOf('</body>')>=0){
      html=html.replace('</body>',bridge+'\n</body>');

    document.open();
    document.write(html);
    document.close();
  }).catch(function(err){

  });
})();
